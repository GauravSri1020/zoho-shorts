  # ================================================================ more PROBLEMS
  - pillar: problems
    kind: problems
    product: Claude (trading myth)
    problem: "Viral posts say 'Claude turned $2,000 into $12,000 overnight trading'"
    fix: "What really happened: a developer used Claude to WRITE a copy-trading bot; Claude never traded"
    facts: "A Finbold story claimed a developer used Claude to build a Polymarket copy-trading bot that grew $2,000 to $12,000 overnight. A rebuttal (Luigi Pascal Rondanini, Medium) points out: the developer made the decisions, the bot copied traders who happened to win (survivorship bias), and one trade is not a strategy. NEVER present trading as an income method; this Short is myth-busting only."
    wow: "Claude can write the code - it cannot make the market go your way"
    source: "https://medium.com/@info_38412/claude-didnt-earn-10k-overnight-and-that-isn-t-how-markets-work-b2bb2717aa76"
  - pillar: problems
    kind: problems
    product: Claude
    problem: "Claude confidently invents a source and it ends up in a client's report"
    fix: "Verify-before-send checklist: ask for sources, open every one, check names and numbers yourself"
    facts: "May 2025: lawyers from Latham & Watkins, representing Anthropic in a copyright case, apologised to the court after a citation formatted with Claude had a wrong title and wrong authors (reported by The Register, Fortune). If it can happen to Anthropic's own lawyers, it can happen in your client work."
    source: "https://www.theregister.com/2025/05/15/anthopics_law_firm_blames_claude_hallucinations/"
  - pillar: problems
    kind: problems
    product: Claude Pro / Max + Claude Code
    problem: "Your client project stops halfway because you hit Claude's usage limit"
    fix: "Plan around limits: batch big tasks, keep prompts tight, use the API for client production work"
    facts: "Anthropic announced weekly rate limits for paid Claude plans in late July 2025 (effective late Aug 2025), aimed at Claude Code users running it nonstop (TechCrunch, 28 Jul 2025). Check current limits on Anthropic's site before quoting numbers - they change."
    source: "https://techcrunch.com/2025/07/28/anthropic-unveils-new-rate-limits-to-curb-claude-code-power-users/"
  - pillar: problems
    kind: problems
    product: Claude API
    problem: "Your AI service makes money on paper but the API bill eats the profit"
    fix: "Measure tokens per customer in a pilot, cache repeated context, price with margin"
    facts: "aibusiness.vc example: an agent billed at $1,500/month with ~$600/month API cost leaves ~60% before hosting, build time and support."
    source: "https://aibusiness.vc/solo/make-money-with-claude-ai"
