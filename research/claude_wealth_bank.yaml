problems:
  # ================================================================ WEALTH 1-4 (the first four Shorts, in this order)
  - pillar: skills_product
    kind: wealth
    order: 1
    product: Claude Skills (SKILL.md) + Stripe checkout
    problem: "You do one task better than most people every week, but you have nothing to sell"
    fix: "Turn that task into a bundle of Claude Skills and sell the bundle as a digital product"
    steps:
      - "Pick ONE task you repeat every week (e.g. writing a YouTube script, an SEO brief, a GST invoice check)"
      - "Talk through how you do it into the Claude app, then ask Claude to turn it into a Skill with the skill-creator skill"
      - "Bundle 3-10 related Skills for one niche, zip them"
      - "Sell on a one-page checkout (Stripe / Gumroad / Razorpay link); offer paid setup for buyers"
    facts: "A Skill is a folder with a SKILL.md instruction file that Claude loads when the task comes up (Anthropic launched Agent Skills in Oct 2025; Anthropic's public skills repo on GitHub includes a 'skill-creator' skill). Creator Ryan Doser reports selling a ~20-skill bundle at $99 per copy, over $5,000 in about 50 days, plus a $1,000 setup job from one buyer - he also has a 10,000+ subscriber newsletter, which is where the sales came from."
    wow: "The product is a few markdown files - the value is YOUR process inside them"
    catch: "His sales came from an existing audience; with zero audience start with 1:1 setup work first"
    source: "https://ryandoser.com/claude-ai-side-hustle/"
  - pillar: claude_code_build
    kind: wealth
    order: 2
    product: Claude Code
    problem: "Non-technical founders have half-built apps stuck on login, payments and deployment"
    fix: "Offer a 'finish my app' service: Claude Code reads their repo, fixes auth/payments, ships it"
    steps:
      - "Find founders with a stuck MVP (Upwork, indie-hacker communities, X / LinkedIn posts)"
      - "Clone their repo, open Claude Code in the terminal and ask it to explain the codebase and list what blocks launch"
      - "Fix one blocker at a time (auth, Stripe payments, deploy) - review and test every change yourself"
      - "Charge per milestone, then a small monthly fee for fixes"
    facts: "Sabrina Ramonov lists a 'vibe code agency' (finishing half-built apps for non-technical founders stuck on auth, payments or deployment) as one of 12 ways to earn with Claude. aibusiness.vc quotes typical asking prices of about $6,000 for a dashboard project or $150/hour - asking prices, not measured earnings."
    wow: "Claude Code can read a whole unfamiliar repo and tell you what is broken before you write a line"
    catch: "You still need to understand code enough to review it - shipping untested AI code to a client is how you lose them"
    source: "https://www.sabrina.dev/p/12-ways-to-make-money-with-claude"
  - pillar: ai_services
    kind: wealth
    order: 3
    product: Claude API + n8n / Make / Zapier
    problem: "Local businesses lose leads because nobody replies after office hours"
    fix: "Sell an AI intake + follow-up automation: form or WhatsApp message -> Claude drafts the reply and qualifies -> lead lands in their sheet/CRM"
    steps:
      - "Pick one local niche (clinics, coaching institutes, real-estate brokers)"
      - "Build the chain: new enquiry -> Claude classifies + drafts a reply -> human approves -> sent + logged"
      - "Measure the API cost on a 1-week pilot before you quote a price"
      - "Charge a setup fee + monthly retainer for running and improving it"
    facts: "aibusiness.vc gives typical custom-agent prices of $3,000-$10,000 to build plus $500-$2,000/month to maintain, and an example agent billed at $1,500/month with about $600/month in API costs (~60% left before hosting and support). Sabrina Ramonov suggests Upwork for first automation clients."
    wow: "The money is in the monthly retainer, not the build"
    catch: "API cost grows with usage - price on measured tokens, never guess"
    source: "https://aibusiness.vc/solo/make-money-with-claude-ai"
  - pillar: creator_engine
    kind: wealth
    order: 4
    product: Claude Projects
    problem: "Small businesses want to post daily but nobody has time to write 30 posts"
    fix: "A one-person social media service: one monthly call -> Claude Project turns the recording into 30 posts in the client's voice"
    steps:
      - "Record a 30-minute monthly call with the client"
      - "Create a Claude Project per client: brand-voice notes + past best posts as knowledge files"
      - "Paste the call transcript and ask for 30 posts across the month, each with a hook and one idea"
      - "Edit, schedule, and send a short report of what performed"
    facts: "Sabrina Ramonov describes a social media agency model: one monthly meeting, AI turns the recording into 30 days of posts. Claude Projects keep custom instructions + knowledge files so every client's voice stays consistent."
    wow: "One recording = a month of content, and the client's own words make it sound human"
    catch: "Pure AI posts with no client input read like slop - the call is what makes it worth paying for"
    source: "https://www.sabrina.dev/p/12-ways-to-make-money-with-claude"

  # ================================================================ PROBLEMS 1 (the 5th Short)
  - pillar: problems
    kind: problems
    order: 5
    product: YouTube + AI
    problem: "People build AI faceless channels with Claude scripts and then get demonetized"
    fix: "Know YouTube's inauthentic-content rule and build the version that stays monetized"
    steps:
      - "July 2025: YouTube renamed 'repetitious content' to 'inauthentic content' - mass-produced, template, repetitive videos are not monetized"
      - "AI is allowed for scripts, thumbnails, captions and visuals of a character YOU invented"
      - "Channels using an AI persona to give health, legal or financial advice are not eligible for monetization"
      - "Fix: one real idea per video, your own research and opinion, different substance every time"
    facts: "YouTube channel monetization policies (support.google.com/youtube/answer/1311392): monetized content must not be mass-produced, generic, repetitive or manipulative; AI content made with generic templates is not allowed; using AI to visualize a unique character and narrative you invented is allowed; channels using AI-generated personas to deliver sensitive topics such as health, legal or financial advice are not eligible."
    wow: "Using AI is not the problem - using it to make the same video 100 times is"
    source: "https://support.google.com/youtube/answer/1311392"

