# Long videos (branch long-videos) -> 4K -> YouTube (scheduled). Manual only. Does NOT touch the Shorts pipeline.
# Run it with "Use workflow from: long-videos". It takes the 1440p master that Claude rendered + checked
# (branch longform-previews), upscales it to 3840x2160 (YouTube then uses its high-bitrate 4K encode, so nothing
# looks blocky), uploads it as private with a publish time, and sets the thumbnail.
name: longform-upload
on:
  push:                      # Claude / Gaurav adds docs/longform/upload-requests/<id>.json on branch long-videos -> upload
    branches: [long-videos]
    paths: ["docs/longform/upload-requests/*.json"]
  workflow_dispatch:
    inputs:
      id:
        description: "video id (files previews/<id>-1440p.mp4, <id>.meta.json, <id>-thumb.jpg on branch longform-previews)"
        default: "uae-einvoicing"
      publish_at:
        description: "publish time, UTC ISO (e.g. 2026-11-14T16:30:00Z = 22:00 IST); empty = in 45 min"
        default: ""
permissions:
  contents: write
concurrency:
  group: longform-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Inputs (button or upload-request file)
        id: in
        run: |
          ID="${{ inputs.id }}"; PUB="${{ inputs.publish_at }}"
          if [ -z "$ID" ]; then
            F=$(git diff --name-only HEAD~1 HEAD -- docs/longform/upload-requests/ 2>/dev/null | head -1)
            [ -z "$F" ] && F=$(ls -t docs/longform/upload-requests/*.json | head -1)
            ID=$(python3 -c "import json,sys;print(json.load(open('$F'))['id'])")
            PUB=$(python3 -c "import json,sys;print(json.load(open('$F')).get('publish_at',''))")
            UPS=$(python3 -c "import json,sys;print('no' if json.load(open('$F')).get('upscale') is False else 'yes')")
          fi
          echo "ups=${UPS:-yes}" >> $GITHUB_OUTPUT; echo "id=$ID" >> $GITHUB_OUTPUT; echo "pub=$PUB" >> $GITHUB_OUTPUT; echo "video $ID publish $PUB"
      - name: Get the master from longform-previews
        run: |
          git fetch --depth=1 origin longform-previews
          mkdir -p in
          for f in "${{ steps.in.outputs.id }}.mp4" "${{ steps.in.outputs.id }}-1440p.mp4" "${{ steps.in.outputs.id }}.meta.json" "${{ steps.in.outputs.id }}-thumb.jpg"; do
            git show "FETCH_HEAD:previews/$f" > "in/$f" || echo "missing $f"
          done
          ls -la in
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg || true
          pip install google-api-python-client google-auth pyyaml
      - name: Upscale to 4K (long videos) / keep as is (vertical Shorts, upscale false)
        run: |
          if [ "${{ steps.in.outputs.ups }}" = "no" ]; then cp "in/${{ steps.in.outputs.id }}.mp4" out4k.mp4; ls -la out4k.mp4; exit 0; fi
          ffmpeg -hide_banner -loglevel error -y -i "in/${{ steps.in.outputs.id }}-1440p.mp4" \
            -vf "scale=3840:2160:flags=lanczos,format=yuv420p" -c:v libx264 -preset veryfast -crf 18 -g 60 \
            -c:a copy -movflags +faststart out4k.mp4
          ffprobe -v error -show_entries stream=width,height:format=duration,size -of compact out4k.mp4
      - name: Upload to YouTube (scheduled)
        run: |
          python -m longform.upload --video out4k.mp4 --meta "in/${{ steps.in.outputs.id }}.meta.json" \
            --thumb "in/${{ steps.in.outputs.id }}-thumb.jpg" --publish "${{ steps.in.outputs.pub }}"
      - name: Record the result on long-videos (so Claude can check it without a browser)
        if: success() && github.ref == 'refs/heads/long-videos'
        run: |
          mkdir -p docs/longform/uploaded
          cp out/uploaded.json "docs/longform/uploaded/${{ steps.in.outputs.id }}.json"
          git config user.name longform-bot; git config user.email longform-bot@users.noreply.github.com
          git add docs/longform/uploaded && git commit -m "uploaded: ${{ steps.in.outputs.id }}" && git pull --rebase origin long-videos && git push origin HEAD:long-videos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longform-upload-${{ steps.in.outputs.id }}
          path: out/uploaded.json
          retention-days: 30
