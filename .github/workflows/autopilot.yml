name: GSX Automation Shorts

on:
  schedule:
    - cron: "30 4 * * *"     # 10:00 IST -> today's script + Flow prompts -> GitHub issue (GitHub e-mails you)
    - cron: "40 */3 * * *"   # every 3 hours -> reply to new comments
  push:                      # you uploaded the Flow clips -> assemble the Short
    branches: [main]
    paths: ["jobs/*/clips/**"]
  workflow_dispatch:
    inputs:
      task:
        description: "daily, assemble or comments"
        default: "daily"
      count:
        description: "daily: how many Shorts"
        default: "1"
      upload:
        description: "upload to YouTube? (yes/no)"
        default: "no"

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a queued run must start from the LATEST main (state saved by the run before it), not the old trigger commit
      - name: Decide task
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
            ARGS=""
            if [ "${{ inputs.task }}" = "daily" ]; then
              ARGS="--count ${{ inputs.count }}"
              if [ "${{ inputs.upload }}" != "yes" ]; then ARGS="$ARGS --no-upload"; fi
            fi
            echo "args=$ARGS" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "task=assemble" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            echo "task=daily" >> $GITHUB_OUTPUT
          else
            echo "task=comments" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install ffmpeg + fonts
        timeout-minutes: 8         # apt mirrors sometimes hang; fail fast instead of waiting hours
        if: steps.t.outputs.task == 'assemble'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
      - name: Install browser for the Zoho Books screens
        if: steps.t.outputs.task == 'assemble'
        run: python -m playwright install --with-deps chromium
      - name: Cache the caption model
        if: steps.t.outputs.task == 'assemble'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
          restore-keys: whisper-

      - name: Run
        run: |
          echo "python -m autopilot.main ${{ steps.t.outputs.task }} ${{ steps.t.outputs.args }}"
          python -m autopilot.main ${{ steps.t.outputs.task }} ${{ steps.t.outputs.args }}

      - name: Keep the Shorts as downloadable artifacts (7 days)
        if: always() && steps.t.outputs.task == 'assemble'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            out/**/short.mp4
            out/**/short.json
            out/**/qa.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state (topics used, schedule, comments replied, Flow jobs)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/state.json state/benchmark.json || true
          git add -A jobs || true
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F-%H%M)" && (git pull --rebase -q || (git rebase --abort; git pull --rebase -q -X theirs)) && git push)
