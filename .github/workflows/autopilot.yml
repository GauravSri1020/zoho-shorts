name: GSX Automation Shorts

on:
  schedule:
    # 11 Nov 2026: research + scripts in the MORNING (Gaurav makes / Claude makes the Flow clips later that day).
    # Off the full hour on purpose: GitHub dropped the "0 9" run on 11 Nov. The 2nd one is a backup - it does
    # nothing when the first one already prepared the Shorts (max_waiting).
    - cron: "47 1 * * *"     # 07:17 IST -> yesterday's Shorts without clips go faceless + 2 new scripts / Flow prompts
    - cron: "13 3 * * *"     # 08:43 IST -> backup of the run above
    - cron: "40 */3 * * *"   # every 3 hours -> reply to new comments
  push:                      # you uploaded the Flow clips -> assemble the Short
    branches: [main]
    paths: ["jobs/*/clips/**"]
  workflow_dispatch:
    inputs:
      task:
        description: "daily, assemble, comments, ttstest or fallback (Shorts without Flow clips -> faceless)"
        default: "daily"
      count:
        description: "daily: how many Shorts"
        default: "1"
      upload:
        description: "upload to YouTube? (yes/no)"
        default: "no"
      face:
        description: "daily: empty = avatar Short (Flow clips, default); no = faceless right away (photo cards + screens)"
        default: ""
      hours:
        description: "fallback: build faceless the Shorts still without clips after this many hours (0 = now)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      FACE: ${{ github.event.inputs.face || '' }}   # yes = Flow avatar Short; empty = faceless (10 Nov 2026)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a queued run must start from the LATEST main (state saved by the run before it), not the old trigger commit
      - name: Decide task
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
            ARGS=""
            if [ "${{ inputs.task }}" = "fallback" ]; then ARGS="--hours ${{ inputs.hours }}"; fi
            if [ "${{ inputs.task }}" = "daily" ]; then
              ARGS="--count ${{ inputs.count }}"
              if [ "${{ inputs.upload }}" != "yes" ]; then ARGS="$ARGS --no-upload"; fi
            fi
            echo "args=$ARGS" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "task=assemble" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "47 1 * * *" ] || [ "${{ github.event.schedule }}" = "13 3 * * *" ]; then
            echo "task=daily" >> $GITHUB_OUTPUT
          else
            echo "task=comments" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Install ffmpeg + fonts
        timeout-minutes: 16        # apt mirrors sometimes hang (10 Nov: twice in one day) -> 3 short tries below
        # 11 Nov 2026: the mirror was down for hours. Writing scripts + Flow prompts needs no ffmpeg, so the run goes
        # on; building a video without ffmpeg fails on its own (nothing broken is ever uploaded).
        continue-on-error: true
        if: steps.t.outputs.task == 'assemble' || steps.t.outputs.task == 'daily' || steps.t.outputs.task == 'fallback'
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2; do
            # 11 Nov 2026: show apt's own messages (the silent -qq hid why it failed); a failed update (one slow
            # mirror / extra repo) must not stop the install from the lists that did download
            timeout 150 sudo apt-get $APT update 2>&1 | grep -E "^(Err|W:|E:)" | head -20 || true
            if timeout 240 sudo apt-get $APT install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core 2>&1 | tail -5 \
               && command -v ffmpeg >/dev/null; then
              exit 0
            fi
            echo "apt try $i failed - retrying"; sleep 15
          done
          exit 1
      - name: Install browser for the Zoho Books screens
        if: steps.t.outputs.task == 'assemble' || steps.t.outputs.task == 'daily' || steps.t.outputs.task == 'fallback'
        # 11 Nov 2026: --with-deps uses apt too (mirror outage) -> scripts / Flow prompts must not wait for it; a video
        # without the browser fails on its own (never uploaded broken)
        continue-on-error: true
        timeout-minutes: 12
        run: python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Cache the caption model
        if: steps.t.outputs.task == 'assemble' || steps.t.outputs.task == 'daily' || steps.t.outputs.task == 'fallback'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
          restore-keys: whisper-

      - name: Run
        run: |
          echo "python -m autopilot.main ${{ steps.t.outputs.task }} ${{ steps.t.outputs.args }}"
          python -m autopilot.main ${{ steps.t.outputs.task }} ${{ steps.t.outputs.args }}

      - name: Keep the Shorts as downloadable artifacts (7 days)
        if: always() && (steps.t.outputs.task == 'assemble' || steps.t.outputs.task == 'daily' || steps.t.outputs.task == 'fallback')
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            out/**/short.mp4
            out/**/short.json
            out/**/qa.json
            out/**/cover.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Preview copy of the Shorts (branch "previews" - Claude can fetch it, Gaurav can open it on GitHub)
        if: always() && (steps.t.outputs.task == 'assemble' || steps.t.outputs.task == 'daily' || steps.t.outputs.task == 'fallback')
        run: |
          shopt -s globstar nullglob
          files=(out/**/short.mp4)
          [ ${#files[@]} -eq 0 ] && { echo "no Short built"; exit 0; }
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp=$(mktemp -d)
          git clone -q --depth 1 -b previews "$remote" "$tmp" 2>/dev/null || { git init -q "$tmp"; git -C "$tmp" checkout -q -b previews; }
          rm -rf "$tmp/.git"
          for f in "${files[@]}"; do d=$(dirname "$f"); id=$(basename "$d"); mkdir -p "$tmp/$id"; cp "$f" "$tmp/$id/"; cp "$d"/qa.json "$d"/short.json "$d"/cover.jpg "$tmp/$id/" 2>/dev/null || true; done
          cd "$tmp" && ls -1dt */ | tail -n +7 | xargs -r rm -rf   # keep the newest 6 Shorts
          git init -q && git checkout -q -b previews && git add -A
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "previews $(date -u +%F-%H%M) run ${GITHUB_RUN_ID}"
          git push -q -f "$remote" previews

      - name: Save state (topics used, schedule, comments replied, Flow jobs)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/*.json || true
          git add -A jobs || true
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F-%H%M)" && (git pull --rebase -q || (git rebase --abort; git pull --rebase -q -X theirs)) && git push)
