<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Inter";src:url("../fonts/Inter-Variable.ttf");font-weight:100 900}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:radial-gradient(900px 700px at 78% 55%,#1f5fd1 0%,#0f2f7a 55%,#0a1c4d 100%);font-family:Inter,Arial,sans-serif;position:relative}
.dots{position:absolute;left:46px;top:300px;width:120px;height:120px;background-image:radial-gradient(#ffffff55 2.5px,transparent 3px);background-size:20px 20px}
.dots2{position:absolute;right:30px;top:24px;width:200px;height:90px;background-image:radial-gradient(#ffffff40 2.5px,transparent 3px);background-size:20px 20px}
.sun{position:absolute;right:-60px;top:110px;width:640px;height:640px;border-radius:50%;background:#ffd23f}
.who{position:absolute;right:20px;bottom:-30px;height:700px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.chip{position:absolute;left:60px;top:54px;display:flex;gap:12px;align-items:center;background:#fff;color:#0a1c4d;font-weight:800;font-size:30px;padding:10px 22px 10px 14px;border-radius:14px}
.flag{width:46px;height:30px;border-radius:5px;overflow:hidden;display:grid;grid-template-columns:12px 1fr}
.flag i{display:block}
.t{position:absolute;left:60px;white-space:nowrap;color:#fff;font-weight:900;letter-spacing:-1px;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.18)}
.t1{top:150px;font-size:104px}
.t2{top:262px;font-size:104px;color:#ffd23f}
.t3{top:374px;font-size:104px}
.pill{position:absolute;left:60px;top:512px;background:#e4573d;color:#fff;font-weight:900;font-size:46px;padding:14px 28px;border-radius:16px;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.doc{position:absolute;left:640px;top:420px;width:150px;height:190px;background:#fff;border-radius:14px;transform:rotate(8deg);box-shadow:0 14px 28px rgba(0,0,0,.3);padding:22px}
.doc b{display:block;height:12px;border-radius:6px;background:#c9d3e6;margin-bottom:16px}
.doc b:first-child{background:#0a1c4d;width:70%}
.doc .ok{position:absolute;right:-26px;bottom:-26px;width:76px;height:76px;border-radius:50%;background:#18a957;color:#fff;font-size:50px;font-weight:900;display:flex;align-items:center;justify-content:center;border:6px solid #fff}
</style></head><body>
<div class="sun"></div><div class="dots"></div><div class="dots2"></div>
<img class="who" id="who" src="../../assets/presenter/point_up.png">
<div class="chip" id="chip">UAE · 2027</div>
<div class="t t1" id="l1"></div>
<div class="t t2" id="l2"></div>
<div class="t t3" id="l3"></div>
<div class="pill" id="pill"></div>
<div class="doc"><b></b><b></b><b></b><b style="width:60%"></b><div class="ok">✓</div></div>
<script>
// data: #<urlencoded JSON> {chip, l1, l2, l3, pill, pose, bg, accent}
const D = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
for (const k of ['chip', 'l1', 'l2', 'l3', 'pill']) { const e = document.getElementById(k); if (D[k]) e.textContent = D[k]; else e.style.display = 'none'; }
if (D.pose) document.getElementById('who').src = '../../assets/presenter/' + D.pose + '.png';
if (D.accent) { document.querySelector('.sun').style.background = D.accent; document.querySelector('.t2').style.color = D.accent; }
if (D.bg) document.body.style.background = D.bg;
// shrink every title line until it fits left of the presenter (max 700 px)
document.fonts.ready.then(() => { for (const k of ['l1', 'l2', 'l3']) { const e = document.getElementById(k); let f = 104;
  while (e.scrollWidth > 700 && f > 50) { f -= 2; e.style.fontSize = f + 'px'; } } document.body.dataset.ready = 1; });
</script></body></html>
