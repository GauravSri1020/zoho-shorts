<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(file:///usr/share/fonts/truetype/google-fonts/ofl/anton/Anton-Regular.ttf)}
@font-face{font-family:Mont;src:url("file:///usr/share/fonts/truetype/google-fonts/ofl/montserrat/Montserrat[wght].ttf");font-weight:100 900}
@font-face{font-family:Emo;src:url(file:///usr/share/fonts/truetype/noto/NotoColorEmoji.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:absolute;inset:0;overflow:hidden;font-family:Mont,Emo,sans-serif;color:#fff}
#card{position:absolute;inset:0;display:none;overflow:hidden;background:linear-gradient(160deg,#070a18 0%,#0e1230 45%,#1a0f2e 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
#rays{position:absolute;inset:-300px;background:conic-gradient(from 200deg at 50% 30%,transparent 0deg,rgba(255,255,255,.05) 20deg,transparent 40deg,rgba(255,255,255,.04) 70deg,transparent 90deg)}
#head{position:absolute;left:40px;right:40px;top:170px;text-align:center;font:400 96px/1 Anton;letter-spacing:1px;text-shadow:0 10px 40px rgba(0,0,0,.5)}
#head em{font-style:normal;color:var(--ac)}
#sub{position:absolute;left:0;right:0;top:278px;text-align:center;font:700 30px Mont;letter-spacing:6px;color:rgba(255,255,255,.65);text-transform:uppercase}
/* laptop */
#lap{position:absolute;left:40px;width:1000px;top:330px}
#lid{position:relative;width:1000px;height:740px;border-radius:34px;background:linear-gradient(180deg,#2b2d33,#151619);padding:18px;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.08) inset}
#scr{position:relative;width:964px;height:704px;border-radius:18px;overflow:hidden;background:#f6f6f8}
#notch{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:150px;height:22px;background:#151619;border-radius:0 0 14px 14px;z-index:5}
#base{position:relative;margin:0 auto;width:1060px;height:30px;left:-40px;background:linear-gradient(180deg,#d9dade,#9a9ca3);border-radius:0 0 30px 30px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
#base i{position:absolute;left:50%;top:0;transform:translateX(-50%);width:170px;height:12px;background:#b7b9be;border-radius:0 0 12px 12px}
#bar{height:58px;background:#ececef;border-bottom:1px solid #dcdce0;display:flex;align-items:center;padding:0 22px;color:#555;font:700 24px Mont}
#bar b{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:10px}
#bar span{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
#chat{position:absolute;left:0;right:0;top:58px;bottom:0;padding:22px 28px;color:#16171c}
.q{position:absolute;right:24px;top:20px;max-width:860px;background:#1d1f27;color:#fff;border-radius:26px 26px 6px 26px;padding:16px 26px;font:700 33px/1.25 Mont}
.ai{position:absolute;left:20px;top:138px;width:46px;height:46px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font:800 26px Mont;color:#111}
.row{position:absolute;left:78px;right:18px;height:96px;border-radius:18px;display:flex;align-items:center;padding:0 16px;font:700 35px/1.12 Mont;color:#1c1d22}
.row .n{flex:none;width:44px;height:44px;border-radius:12px;background:#16171c;color:#fff;font:800 24px/44px Mont;text-align:center;margin-right:16px}
.row .e{flex:none;font:44px Emo;margin-right:14px}
.tile{position:absolute;border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(20,20,40,.12);text-align:center;padding-top:18px}
.tile .b{font:400 84px/1 Anton;color:#16171c}
.tile .l{font:700 27px/1.2 Mont;color:#555;margin-top:10px;padding:0 10px}
.note{position:absolute;left:78px;bottom:14px;font:700 26px Mont;color:#7a7b85;letter-spacing:1px}
.stk{position:absolute;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:72px Emo;z-index:12}
/* top + overlays */
#prog{position:absolute;left:0;top:0;height:9px;background:linear-gradient(90deg,var(--ac),#fff);z-index:20}
#pill{position:absolute;left:46px;top:60px;padding:13px 24px 13px 54px;border-radius:40px;background:#e11d2e;font:800 30px Mont;letter-spacing:2px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#pill i{position:absolute;left:22px;top:21px;width:18px;height:18px;border-radius:50%;background:#fff}
#tick{position:absolute;right:46px;top:56px;padding:11px 22px;border-radius:18px;background:rgba(5,7,10,.72);border:2px solid rgba(255,255,255,.2);font:700 34px "DejaVu Sans Mono",monospace;z-index:20}
#tick b{color:#9be22d}
#src{position:absolute;left:60px;right:60px;top:138px;text-align:center;font:600 22px Mont;color:rgba(255,255,255,.45);z-index:5}
#caps{position:absolute;left:40px;right:40px;top:1345px;text-align:center;font:900 84px/1.15 Mont;text-transform:uppercase;
  -webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.6);z-index:30}
#caps span{display:inline-block;margin:0 12px;padding:0 10px;border-radius:14px}
#hook{position:absolute;left:60px;right:60px;top:1010px;text-align:center;z-index:25;display:none}
#hook div{display:inline-block;background:rgba(255,255,255,.96);color:#0d0f16;padding:20px 34px 12px;border-radius:24px;font:400 96px/1.02 Anton;box-shadow:0 18px 50px rgba(0,0,0,.5)}
#hook em{font-style:normal;background:linear-gradient(transparent 55%,var(--ac) 55%);padding:0 6px}
#hook small{display:block;font:800 26px Mont;letter-spacing:5px;color:#e11d2e;margin-bottom:6px}
#cta{position:absolute;left:0;right:0;top:1040px;text-align:center;z-index:25;display:none}
#cta div{display:inline-block;background:var(--ac);color:#0b0d12;padding:22px 44px;border-radius:70px;font:900 58px Mont;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#ring{position:absolute;border-radius:50%;border:10px solid var(--ac);box-shadow:0 0 50px var(--ac);z-index:15;display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:40}
</style></head><body>
<div id="stage">
 <div id="card"><div class="orb" id="o1"></div><div class="orb" id="o2"></div><div id="rays"></div>
  <div id="head"></div><div id="sub"></div>
  <div id="lap"><div id="lid"><div id="notch"></div><div id="scr"><div id="bar"><b style="background:#ff5f57"></b><b style="background:#febc2e"></b><b style="background:#28c840"></b><span>AI Assistant</span></div><div id="chat"></div></div></div><div id="base"><i></i></div></div>
  <div id="stks"></div>
 </div>
 <div id="prog"></div>
 <div id="pill"><i></i><span id="pilltxt"></span></div>
 <div id="tick"></div>
 <div id="src"></div>
 <div id="hook"><div id="hooktxt"></div></div>
 <div id="cta"><div id="ctatxt"></div></div>
 <div id="ring"></div>
 <div id="caps"></div>
 <div id="flash"></div>
</div>
<script>
const D=window.DATA; const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
document.documentElement.style.setProperty('--ac',D.accent||'#ffd23f');
$('pilltxt').textContent=D.pill; $('tick').innerHTML=D.ticker;
$('o1').style.cssText+=`;width:900px;height:900px;background:${D.accent||'#ffd23f'}`; $('o2').style.cssText+=`;width:1000px;height:1000px;background:${D.accent2||'#5b5bff'}`;
let built=null;
function build(s){
  $('head').innerHTML=s.head||''; $('sub').textContent=s.sub||'';
  const c=$('chat'); let h=`<div class="q" id="q"></div><div class="ai" id="ai">AI</div>`;
  const n=(s.items||[]).length;
  if(s.mode==='numbers'){
    const cols=n>4?3:2, rows=Math.ceil(n/cols), W=(850-(cols-1)*18)/cols, H=n>4?210:230;
    s.items.forEach((it,i)=>{const r=Math.floor(i/cols), k=i%cols; h+=`<div class="tile" id="it${i}" style="left:${84+k*(W+18)}px;top:${135+r*(H+18)}px;width:${W}px;height:${H}px"><div class="b">${it[0]}</div><div class="l">${it[1]}</div></div>`});
  } else {
    const gap=n>4?97:118;
    s.items.forEach((it,i)=>{h+=`<div class="row" id="it${i}" style="top:${(n>4?126:132)+i*gap}px;height:${n>4?88:96}px">${s.mode==='timeline'?`<span class="n" style="width:auto;padding:0 12px">${it[0]}</span>`:`<span class="n">${i+1}</span><span class="e">${it[0]}</span>`}<span id="tx${i}"></span></div>`});
  }
  if(s.note) h+=`<div class="note" id="note">${s.note}</div>`;
  c.innerHTML=h;
  let sh=''; (s.stickers||[]).forEach((e,i)=>{const P=[[22,300],[926,330],[16,1010],[930,980]][i%4]; sh+=`<div class="stk" id="sk${i}" style="left:${P[0]}px;top:${P[1]}px">${e}</div>`}); $('stks').innerHTML=sh;
}
function render(t){
  $('prog').style.width=(1080*t/D.dur)+'px';
  const s=D.scenes.find(s=>t>=s.t0&&t<s.t1); const card=$('card'), ring=$('ring');
  if(s){ if(built!==s){build(s);built=s}
    card.style.display='block'; const lt=t-s.t0, dur=s.t1-s.t0;
    card.style.opacity=ease(lt/0.18);
    $('o1').style.transform=`translate(${-200+120*Math.sin(t*.5)}px,${-150+80*Math.cos(t*.4)}px)`;
    $('o2').style.transform=`translate(${400+100*Math.cos(t*.45)}px,${900+90*Math.sin(t*.35)}px)`;
    $('rays').style.transform=`rotate(${t*4}deg)`;
    $('head').style.transform=`translateY(${(1-ease(lt/0.35))*-60}px)`; $('head').style.opacity=ease(lt/0.35);
    $('sub').style.opacity=ease((lt-.2)/0.3);
    const lp=back(lt/0.45); $('lap').style.transform=`translateY(${(1-ease(lt/0.45))*260}px) scale(${0.9+0.1*lp}) rotateX(${(1-ease(lt/.5))*18}deg)`;
    // question types in
    const q=s.q||''; const qn=Math.floor(clamp((lt-0.35)/0.9)*q.length); $('q').textContent=q.slice(0,qn)+(qn<q.length?'▍':''); $('q').style.opacity=lt>0.3?1:0;
    $('ai').style.opacity=ease((lt-1.2)/0.3);
    const n=(s.items||[]).length, a0=1.4, a1=Math.max(a0+0.6,dur-1.0);
    s.items.forEach((it,i)=>{const at=a0+(n>1?(a1-a0)*i/(n-1):0); const p=ease((lt-at)/0.35); const e=$('it'+i);
      e.style.opacity=p; e.style.transform=`translateY(${(1-p)*30}px) scale(${0.96+0.04*p})`;
      const nxt=i+1<n? a0+(a1-a0)*(i+1)/(n-1):1e9; const on=lt>=at&&lt<nxt;
      if(s.mode!=='numbers'){ e.style.background=on?'color-mix(in srgb, var(--ac) 28%, white)':'transparent';
        const tx=it[1]; const k=Math.floor(clamp((lt-at)/0.6)*tx.length); $('tx'+i).textContent=tx.slice(0,k); }
      else { e.style.boxShadow=on?'0 0 0 5px var(--ac),0 10px 30px rgba(20,20,40,.18)':'0 10px 30px rgba(20,20,40,.12)'; }
    });
    if($('note')) $('note').style.opacity=ease((lt-a1-0.3)/0.4);
    (s.stickers||[]).forEach((x,i)=>{const e=$('sk'+i); const p=back((lt-0.5-i*0.35)/0.4); e.style.transform=`scale(${Math.max(0,p)}) translateY(${8*Math.sin(t*3+i)}px) rotate(${6*Math.sin(t*2+i)}deg)`});
    ring.style.display='block'; const P=D.pip; const rp=back(clamp((lt-0.12)/0.3));
    ring.style.left=(P.x-P.r-10)+'px'; ring.style.top=(P.y-P.r-10)+'px'; ring.style.width=ring.style.height=(2*P.r+20)+'px'; ring.style.transform=`scale(${rp})`;
    $('src').textContent=D.src||''; $('src').style.display='block';
  } else {card.style.display='none'; ring.style.display='none'; built=null; $('src').style.display='none'}
  let fl=0; for(const sc of D.scenes){const d=t-sc.t0; if(d>=0&&d<0.1) fl=0.25*(1-d/0.1)} $('flash').style.opacity=fl;
  const H=D.hook; if(t>=H.t0&&t<H.t1){$('hook').style.display='block'; $('hooktxt').innerHTML=H.html; $('hook').style.transform=`scale(${back((t-H.t0)/0.3)}) rotate(-1.5deg)`} else $('hook').style.display='none';
  const C=D.cta; if(C&&t>=C.t0&&t<C.t1){$('cta').style.display='block'; $('ctatxt').innerHTML=C.html; $('cta').style.transform=`scale(${back((t-C.t0)/0.3)*(1+0.03*Math.sin((t-C.t0)*7))})`} else $('cta').style.display='none';
  const caps=$('caps'); const w=D.words; let gi=-1;
  for(let i=0;i<w.length;i++){ if(t>=w[i].t0-0.02 && t<w[i].gend){gi=i;break} }
  if(gi<0) caps.innerHTML=''; else { const g=w[gi].g; const grp=w.filter(x=>x.g===g);
    caps.innerHTML=grp.map(x=>{const on=t>=x.t0-0.02, cur=on&&t<x.t1+0.05; const col=x.hl?'var(--ac)':'#fff';
      return `<span style="color:${cur?'#0b0d12':col};background:${cur?'var(--ac)':'transparent'};-webkit-text-stroke:${cur?'0':'4px #000'};opacity:${on?1:0};transform:scale(${on?(t-x.t0<0.08?1.1:1):0.9})">${x.w}</span>`}).join(' ');}
}
window.render=render;
</script></body></html>
