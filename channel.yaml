# =====================================================================================
#  CHANNEL SETTINGS  -  sab kuch yahin se badlo (naam, niche, feeds, timing)
#  Fully automatic: AI research, script, QA, AI voice, AI avatar (tere photo se), video, upload.
#  AI avatar + AI voice -> YouTube ka 'altered or synthetic content' label har video pe ON rehta hai.
# =====================================================================================

channel:
  name: "GSX Automation"         # shown on videos and in descriptions
  handle: "@GSXAutomation"       # your YouTube @handle (update once your existing channel is connected)
  language: "English"           # Hinglish | Hindi | English  (scripts + captions)
  hashtags: ["Shorts", "ZohoCRM", "Zoho", "BusinessAutomation"]
  # Keep "Zoho" OUT of the channel name/logo (trademark). Using it in titles/tags to describe the topic is fine.
  disclaimer: "Independent channel. Not affiliated with or endorsed by Zoho Corporation. Zoho is a trademark of Zoho Corporation."

# What the channel is about. The agents read this to decide WHAT to make.
niche:
  topic: "Zoho products (CRM, Books, Creator, Desk, Inventory, Forms, Analytics, People, Campaigns, Flow)"
  audience: "Indian small business owners, Zoho admins, Zoho consultants and developers"
  promise: >-
    every Short takes ONE real problem people hit while using a Zoho product and shows how to fix it:
    inside Zoho (settings, workflow rules, blueprints, custom functions in Deluge), with a small widget,
    or by connecting an outside HTML page (form / dashboard / webhook / API).
  good_problems:
    - "Zoho CRM me duplicate leads ban jaate hain, sales team confuse hoti hai"
    - "Zoho Books me invoice bana ke WhatsApp pe bhejna manually karna padta hai"
    - "website ke custom HTML form ki leads Zoho CRM me automatically nahi aati"
    - "Zoho Desk me tickets ka auto-assignment galat agent ko jaata hai"
    - "Zoho Creator report me ek button chahiye jo PDF bana ke mail kar de"
  solution_types:                # the scout picks one per Short
    native: "fix with built-in settings: workflow rules, blueprint, validation rules, assignment rules, layouts"
    deluge: "a short Deluge custom function / schedule / button script"
    widget: "a small Zoho widget (HTML + JS SDK) inside CRM / Desk / Creator"
    html: "an outside HTML page connected to Zoho (web form, webhook, REST API, embed)"
  skip: "pricing/discount news, funding news, opinion pieces, anything without a practical fix"
  safety: "no financial, tax or legal advice; never show real customer data"
  cta: "Follow {name} for more quick Zoho fixes"

# Where the research agent looks for real problems people are asking about. Any RSS / Atom feed works.
sources:
  feeds:
    - "https://www.reddit.com/r/zoho/new/.rss"
    - "https://stackoverflow.com/feeds/tag/zoho"
    - "https://stackoverflow.com/feeds/tag/zoho-deluge"
    - "https://stackoverflow.com/feeds/tag/zoho-creator"
    - "https://stackoverflow.com/feeds/tag/zoho-crm"
    - "https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=%22Zoho+CRM%22+when:7d"
    - "https://news.google.com/rss/search?hl=en-IN&gl=IN&ceid=IN:en&q=Zoho+new+feature+when:7d"
  keywords: ["zoho", "deluge", "crm", "creator", "zoho books", "zoho desk", "widget", "blueprint", "workflow"]
  lookback_days: 10
  # If the feeds give nothing useful, the scout picks a common, evergreen Zoho problem from its own knowledge.
  evergreen_fallback: true

# Shorts per day (each one goes into the next free morning / evening slot)
scripts:
  per_day: 1
  words_min: 110
  words_max: 150

# The presenter: YOU, made in Google Flow (your avatar + Veo 3.1 with its own voice) - see autopilot/flow.py
# Every morning a GitHub issue (e-mailed to you) lists the clip prompts; you make the clips in Flow and drop them
# into the upload link; the robot does everything else (joins, hides watermark, Zoho screens, captions, music, QA, upload).
flow:
  per_day: 1                  # Shorts prepared per day (each needs ~5-8 Flow clips; Veo 3.1 Fast ~10-20 credits each)
  max_words_per_clip: 19      # ~7.5 s of speech -> fits one 8 s Flow clip
  presenter: "The man (my avatar)"   # how every prompt refers to you - select your avatar in Flow before pasting
  scene: "wearing a smart navy blue shirt, standing in a bright modern office with soft daylight"   # your look + place, same in every clip
  watermark:                  # Flow puts a visible watermark on every clip; the editor hides it
    mode: "crop"              # crop = cut the bottom strip away | blur = blur the box below | none
    crop_bottom: 0.10         # part of the height cut from the bottom (crop mode)
    box: [0.74, 0.88, 0.24, 0.10]   # x, y, width, height as parts of the frame (blur mode)

# When videos go public (IST). A random minute inside each window, every day different,
# and never the same time as the previous day's slot.
schedule:
  windows:
    morning: "07:00-08:00"
    evening: "20:00-21:00"
  min_gap_from_yesterday_minutes: 8
  min_lead_minutes: 30           # never schedule a video less than 30 min after it is made

# Captions / editing
captions:
  whisper_model: "small"         # word timings for captions (tiny | base | small)
  whisper_language: "en"         # hi for Hinglish/Hindi, en for English
  roman_captions: false           # show Hinglish captions in Roman letters (Devanagari if false or if it fails)
  max_words: 3

video:
  max_seconds: 60

labels:
  hook_badge: ""                  # small badge top-right ("" = none)

youtube:
  category_id: "28"              # 28 = Science & Technology, 27 = Education, 26 = Howto & Style
  language: "en"                 # hi | en

# Benchmark agent: watches these Shorts (and the most-viewed Zoho Books Shorts on YouTube) every 14 days,
# then scores every new video against them. Upload happens ONLY if score >= min_score and the avatar lip-syncs.
benchmark:
  min_score: 75
  youtube_search: "Zoho Books"
  references:
    - {url: "https://www.youtube.com/shorts/iw5N2XbH3m0", weight: 3, note: "MOST PREFERRED - title on top, video panel in the middle, caption box below, b-roll cuts"}
    - {url: "https://www.youtube.com/shorts/SiT0DF2jkyw", weight: 2, note: "news-interview style, like this but with AI faces"}
    - {url: "https://www.youtube.com/shorts/XtZQSylRrF4", weight: 2, note: "Zoho Books trainer talking head + illustration cutaways + highlighted captions"}
    - {url: "https://www.youtube.com/shorts/9Yna9kWjysU", weight: 2, note: "Hindi step-by-step Zoho Books screen recording"}
    - {url: "https://www.youtube.com/shorts/KQeXrvncz_k", weight: 1, note: "AI visuals, fast cuts, music"}
    - {url: "https://www.youtube.com/shorts/Q9rWfCbDhk8", weight: 1, note: "AI visuals, music, strong hook"}
